<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css"/>
  <title>Ejercicio 2 CSS</title>
</head>
  <style>
    body {
      background: pink;
      color: blue;
      font-size: 20px;
      text-align: center;
    }

    .plata {
      background: silver;
    }

    .derecha {
      text-align: right;
    }
  </style>
<body>

  <p>Texto <span style="color: red;">centrado.</span></p>

  <p class="plata">Texto centrado sobre fondo de color plata.</p>

  <p class="derecha">Texto <span style="color: red;">alineado</span> a la derecha.</p>

  <p class="plata">Otro texto centrado sobre fondo de color plata.</p>

</body>
</html>
