<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>EJEMPLO 16</title>  
  </head>
  <body>
    <h1>Patatas fritas</h1>
        <hr>
      <figure>
        <img src="imagenes/16-patatas-fritas.png"
              width="288" height="185">
            <figcaption>Patatas fritas caseras</figcaption>
      </figure>

    <h2>Ingredientes</h2>
    <ul>
        <li>3 ó 4 patatas (300gr)</li>
        <li>4 dientes de ajo</li>
        <li>Aceite de oliva</li>
        <li>Sal</li>
    </ul>

    <h2>Elaboración (Pasos)</h2>
    <ol>
        <li>Calentae aceite en un sartén</li>
        <li>Añadir la patata cortada, la sal y los ajos</li>
        <li>Freír al gusto</li>
        <li>Servir en plato</li>
    </ol>

  </body>
</html>
