<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formularios</title>  
  </head>
  <body>
        <form action="validar.php" method="get" novalidate="novalidate">
            <fieldset>
                <legend>Para datos personales</legend>
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefeno" name="telefeno" placeholder="9 números" maxlength="9" size="9" min="9" max="9"/>
                <br>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" size="50" placeholder="El formato correcto es nombre+@+servidor de correo" autocomplete="on">
            </fieldset>

            <fieldset>
                <legend>Para valores numéricos</legend>
                <label for="numperson">Números de personas</label>
                <input type="number" id="numperson" name="numperson" min="1" max="20" value="1" step="1">
                <br>
                <label for="barra">Mueve la barra para indicar puntuación (Del 1 al 10)</label>
                <input type="range" id="barra" name="barra" min="1" max="10" step="1" value="0" >
            </fieldset>

            <fieldset>
                <legend>URL y búsqueda</legend>
                <label for="url">URL de tu sitio</label>
                <input type="url" id="url" name="url">
                <br>
                <label for="interes">¿Qué te interesa buscar?</label>
                <input type="text" id="interes" name="interes">
            </fieldset>

            <fieldset>
                <legend>Otros tipos</legend>
                <label for="color">Color</label>
                <input type="color" id="color" name="color">
            </fieldset>

            <fieldset>
                <legend>Para Fechas</legend>
                <label for="dia_año">Seleccione un día (Hasta fin de año)</label>
                <input type="date" id="dia_año" name="dia_año" max="2026-12-31">
                <br>
                <label for="hora">Seleccione una hora</label>
                <input type="time" id="hora" name="hora">
                <br>
                <label for="mes_año">Seleccione un mes (Hasta junio del 2020)</label>
                <input type="month" id="mes_año" name="mes_año" max="2020-06-30">
                <br>
                <label for="semana_año">Seleccione una semana (Hasta junio del 2020)</label>
                <input type="week" id="semana_año" name="semana_año" max="2020-06-30">
                <br>
                <label for="tiempo_año">Seleccione fecha y hora</label>
                <input type="datetime-local" id="tiempo_año" name="tiempo_año">
                <br>
            </fieldset>
            <button type="submit">
                <img src="imagenes/greentick.jpg" alt="Enviar" width="70" height="70">
                Validar
            </button> 
             <button type="reset">
                <img src="imagenes/redtick.png" alt="Limpiar" width="70" height="70">
                Limpiar
            </button> 
        </form>
  </body>
</html>
