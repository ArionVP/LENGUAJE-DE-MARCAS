<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Validación de usuario</title>  
  </head>
  <body>
        <form action="servicio.php" method="get">
            <fieldset>
                <legend>Introducción de Datos</legend>
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Introducir Nombre" maxlength="10" size="10"/>
                <hr>
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña name="contraseña" placeholder="Introducir Contraseña" maxlength="12" size="12"/>
                <hr>
                <input type="submit" value="Enviar"/>
                <input type="reset" value="Resetear"/>
            </fieldset>
        </form>
  </body>
</html>
